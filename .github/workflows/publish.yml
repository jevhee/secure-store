name: Publish library

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 0.1.0 or 0.1.0-beta.1
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $RELEASE_VERSION"
            exit 1
          fi

      - name: Verify project
        run: ./gradlew --no-daemon clean check lint

      - name: Publish package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          MAVEN_REPOSITORY_URL: https://maven.pkg.github.com/${{ github.repository }}
          MAVEN_REPOSITORY_USERNAME: ${{ github.actor }}
          MAVEN_REPOSITORY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon \
            -Dmaven.repo.local="${RUNNER_TEMP}/securestore-m2" \
            :secure-store:publish \
            :secure-store:publishToMavenLocal \
            -PGROUP=io.github.jevhee \
            -PPOM_ARTIFACT_ID=secure-store \
            -PVERSION_NAME="$RELEASE_VERSION" \
            -PPOM_URL="https://github.com/${GITHUB_REPOSITORY}" \
            -PPOM_DEVELOPER_ID=jevhee \
            -PPOM_DEVELOPER_NAME=jevhee \
            -PPOM_SCM_URL="https://github.com/${GITHUB_REPOSITORY}" \
            -PPOM_SCM_CONNECTION="scm:git:https://github.com/${GITHUB_REPOSITORY}.git" \
            -PPOM_SCM_DEV_CONNECTION="scm:git:ssh://git@github.com/${GITHUB_REPOSITORY}.git"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: secure-store-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/securestore-m2/io/github/jevhee/secure-store/${{ inputs.version }}/
          if-no-files-found: error
          retention-days: 14
